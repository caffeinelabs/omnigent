# PREVIEW-ONLY (drop before upstream): default jcode profile for the
# caffeine-sandbox preview cluster. Points at the keyless in-cluster Bifrost
# so the preview exercises the harness without real credentials.
[provider]
default_provider = "bifrost"
default_model = "openrouter/z-ai/glm-5.2"

[providers.bifrost]
type = "openai-compatible"
base_url = "http://bifrost.bifrost.svc.cluster.local:4000/v1"
auth = "bearer"
api_key_env = "JCODE_PROVIDER_BIFROST_API_KEY"
# Bare filename only (jcode rejects paths); resolved under jcode's config
# dir — $JCODE_HOME/config/jcode/provider-bifrost.env in the baked image.
env_file = "provider-bifrost.env"
default_model = "openrouter/z-ai/glm-5.2"
requires_api_key = true
# Present-but-empty header: Bifrost's per-request deny-all for MCP tool
# injection. jcode owns MCP execution via its mcp-remote bridge to /mcp, so
# gateway-injected tool names must never be offered to the model. Needs a
# jcode release containing extra_headers (1jehuang/jcode#933); silent no-op
# on older jcode (unknown key, ignored).
extra_headers = { "x-bf-mcp-include-tools" = "" }

[[providers.bifrost.models]]
id = "openrouter/z-ai/glm-5.2"
context_window = 131072
