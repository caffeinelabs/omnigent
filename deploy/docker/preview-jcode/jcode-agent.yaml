name: jcode
description: >-
  jcode (https://jcode.sh) — Rust coding-agent daemon driven through its ACP
  adapter (jcode acp). Provider, model, and auth come from jcode's own config
  (~/.jcode/config.toml); Omnigent stores no credential. The os_env/terminals
  blocks give the web UI its Files / Changes / Shell tabs; the harness itself
  owns all file/shell tools.
executor:
  harness: jcode

prompt: |
  You are jcode, running inside Omnigent via its ACP adapter. Help the user
  with software engineering tasks — read files, edit code, run tests, and
  explain your reasoning. Keep responses concise and prefer showing diffs or
  commands over describing them in prose.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Web-UI "+ New shell" affordance (bash is what the slim host image ships).
terminals:
  bash:
    command: bash
    allow_cwd_override: true
    os_env:
      type: caller_process
      cwd: .
      sandbox:
        type: none
