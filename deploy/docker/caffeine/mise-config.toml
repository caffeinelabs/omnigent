# System-wide mise config baked into the sandbox host image so `cd`-ing into a
# checked-out repo (e.g. caffeinelabs/app) auto-activates its mise.toml toolchain
# without an interactive trust prompt.
[settings]
experimental = true
# Trust any config under the sandbox HOME (where repos are cloned), so the
# repo's `enter`/`postinstall` hooks (mise install, corepack enable) run.
trusted_config_paths = ["/home/omnigent"]
# Auto-enable corepack whenever mise installs node, so pnpm/yarn shims exist.
node.corepack = true
