# Builds the Caffeine server + host images and pushes them to our registry:
#
#   ghcr.io/caffeinelabs/omnigent-server:<branch>{,-<sha>}  (server, kubernetes extra)
#   ghcr.io/caffeinelabs/omnigent-host:<branch>{,-<sha>}    (runner host, same commit)
#
# On `staging`, that yields `:staging` / `:staging-<sha>`.
# `cursor/**` working-branch pushes publish branch-scoped soak tags without
# moving `:staging`. Keep workflow edits OUT of untrusted PRs long-term
# (sensitive-path guard); use a short-lived commit to publish, then revert.
name: Caffeine Server Image

on:
  push:
    branches: [staging, 'cursor/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build server + host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server meta
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnigent-server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            OMNIGENT_EXTRAS=kubernetes
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Host meta
        id: host-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnigent-host
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: host
          push: true
          platforms: linux/amd64
          tags: ${{ steps.host-meta.outputs.tags }}
          labels: ${{ steps.host-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summarize published tags
        run: |
          {
            echo "### Published images"
            echo ""
            echo "**Server**"
            echo '```'
            echo "${{ steps.server-meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Host**"
            echo '```'
            echo "${{ steps.host-meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
