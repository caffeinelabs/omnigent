# Builds the Caffeine server + host images and pushes them to our registry:
#
#   ghcr.io/caffeinelabs/omnigent-server:<branch>{,-<sha>}  (server, kubernetes extra)
#   ghcr.io/caffeinelabs/omnigent-host:<branch>{,-<sha>}    (runner host, same commit)
#
# On `staging`, that yields the familiar `:staging` / `:staging-<sha>` tags.
# `workflow_dispatch` on any other branch (e.g. a PR working branch) publishes
# the same pair under a sanitized branch tag so we can soak-test images
# before merging — without moving `:staging`.
#
# The server needs the `kubernetes` extra (the sandbox launcher imports the
# Python k8s client, which the upstream published image omits). We build the
# host from the SAME commit rather than reusing ghcr.io/omnigent-ai/omnigent-host
# (which only publishes up to v0.1.x) so host↔server protocol always matches.
# opencode is NOT baked in yet — add it here when we move past the GIT_AUTHOR
# test. Distinct from the inherited upstream `oss-publish-images.yml`, which
# targets ghcr.io/omnigent-ai (not writable by this fork) and ships no extras.
name: Caffeine Server Image

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build server + host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch-scoped tags: `type=ref,event=branch` → floating tag named after
      # the branch (sanitized; `cursor/foo` → `cursor-foo`). The sha tag is the
      # immutable pin (`cursor-foo-<shortsha>`). Staging keeps publishing
      # `:staging` / `:staging-<sha>` because that is the branch name.
      - name: Server meta
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnigent-server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      # amd64 only: this runs as our omnigent server on the (amd64) sandbox
      # cluster. build-arg adds the kubernetes client so the sandbox launcher
      # can import it — the whole point of the fork.
      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            OMNIGENT_EXTRAS=kubernetes
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Host meta
        id: host-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnigent-host
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      # Runner host image, `host` target of the same Dockerfile, same commit as
      # the server so the dial-back protocol matches. amd64 only — the launcher
      # hard-pins runner Pods to kubernetes.io/arch: amd64. Reuses the builder
      # layers cached by the server build above.
      - name: Build and push host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: host
          push: true
          platforms: linux/amd64
          tags: ${{ steps.host-meta.outputs.tags }}
          labels: ${{ steps.host-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summarize published tags
        run: |
          {
            echo "### Published images"
            echo ""
            echo "**Server**"
            echo '```'
            echo "${{ steps.server-meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Host**"
            echo '```'
            echo "${{ steps.host-meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
