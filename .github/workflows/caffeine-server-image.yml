# Builds the Caffeine server image from this fork's `staging` branch WITH the
# `kubernetes` extra (the k8s sandbox launcher imports the Python k8s client,
# which the upstream published image omits) and pushes it to our registry.
#
#   ghcr.io/caffeinelabs/omnigent-server:staging          (moving, latest staging)
#   ghcr.io/caffeinelabs/omnigent-server:staging-<sha>    (immutable, pin this)
#
# Distinct from the inherited upstream `oss-publish-images.yml`, which targets
# ghcr.io/omnigent-ai (not writable by this fork) and ships no extras.
name: Caffeine Server Image

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build server (kubernetes extra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnigent-server
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: this runs as our omnigent server on the (amd64) sandbox
      # cluster. build-arg adds the kubernetes client so the sandbox launcher
      # can import it — the whole point of the fork.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            OMNIGENT_EXTRAS=kubernetes
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
